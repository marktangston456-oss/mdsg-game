<script>
/* Auto-update checker - Made by Risan. Bump "v" in version.json to notify users. */
(()=>{const APP_V=11;window.MDSG_V=APP_V;let shown=0;
/* >>> GITHUB LINK (must end with /) <<< */

 +'<div id="upr" style="display:none"><button id="upz" style="'+GB+'"></button><button id="upo" style="'+LB+'"></button><div id="upw" style="margin-top:12px;font-size:12px;line-height:1.4;opacity:.75"></div></div></div>';

  try{await doUpdate(set,j);showReady()}catch(e){q('#ups').textContent=T3('Update failed. Check internet and try again.','Update fail hua. Internet check karke phir try karo.','আপডেট হয়নি। ইন্টারনেট দেখে আবার চেষ্টা করো।');q('#upa').style.display='block';q('#upb').style.display='none';q('#upy').textContent=T3('TRY AGAIN','PHIR SE','আবার')}}}
window.mdsgCheck=async function(manual){
 try{const r=await fetch(VU+'?t='+Date.now(),{cache:'no-store'}),j=await r.json();saveNews(j);
  if(j.v>APP_V||/[?&]testupdate/.test(location.search)){
